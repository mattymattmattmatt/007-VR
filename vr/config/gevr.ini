# GoldenEye 007 VR - runtime settings.
#
# Copy next to the executable. Every value below is the built-in default, so
# an empty file and a missing file behave identically. Unknown keys are
# reported and skipped, and out-of-range values are clamped rather than
# rejected, so this file cannot leave you with an unplayable session.

[world]
# GoldenEye units per real metre. The engine is roughly centimetre-scaled.
# To measure it: run ge007vr-calibrate, walk exactly one grid square (1 m),
# and watch the reported position change. Raise this to make the world feel
# larger, lower it to feel smaller.
world_scale       = 100.0
player_height     = 1.75
# 1.0 is true stereo. Below 1.0 flattens the depth, which some players prefer
# at N64 geometry scale because it makes rooms read as bigger.
ipd_scale         = 1.0

[turning]
# snap | smooth | off. Snap is the comfortable default; "off" means you turn
# by physically turning, for a swivel chair or roomscale.
turn_mode         = snap
snap_degrees      = 30.0
snap_threshold    = 0.70
snap_release      = 0.35
smooth_turn_dps   = 120.0

[locomotion]
# head | hand | body. "head" means the stick moves you where you are looking,
# which is the closest match to how Goodhead plays flat.
locomotion_ref    = head
move_deadzone     = 0.15
move_curve        = 1.0
turn_deadzone     = 0.20
turn_curve        = 1.0

[aiming]
# head       - the gun follows your view. Closest to the N64 feel.
# controller - in aim mode, the crosshair follows your right hand.
aim_mode          = head
aim_yaw_gain      = 2.5
aim_pitch_gain    = 2.5

[servo]
# The engine owns the camera angles because it uses them for hitscan, so the
# VR layer drives them onto the headset's with a proportional controller.
# Higher gain tracks faster but can wobble when you stop moving your head.
servo_yaw_gain    = 6.0
servo_pitch_gain  = 6.0
servo_max         = 1.0
servo_deadband    = 0.00436
# Flip if the view pitches the wrong way. This is the engine's axis polarity,
# separate from the in-game "look up/down" option.
invert_pitch      = 0

[comfort]
vignette_enabled  = 1
vignette_strength = 0.55
haptics_scale     = 1.0

[render]
render_scale      = 1.0
z_near            = 0.05
# 0 selects an infinite far plane, which stops distant geometry and skyboxes
# clipping when a level's own far distance is shorter than feels right in VR.
z_far             = 0.0
hud_enabled       = 1
hud_distance      = 1.6
hud_scale         = 1.0
mirror_window     = 1

[bindings]
# Sources: trigger_l trigger_r grip_l grip_r a b x y menu stick_l stick_r none
# Actions keep their N64 pad and button whatever you bind them to, because the
# Goodhead routing is what makes the twin-stick split work.
bind_fire         = trigger_r
bind_aim          = trigger_l
bind_use          = a
bind_weapon       = b
bind_pause        = y
bind_crouch       = grip_l
bind_recenter     = x

[misc]
swap_sticks       = 0
left_handed       = 0
